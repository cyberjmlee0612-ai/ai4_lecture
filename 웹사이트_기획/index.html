<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102b35" />
  <meta name="description" content="EXHIBIT FLOW — 전시 프로젝트의 비교, 소통, 준비를 하나의 흐름으로 관리하세요." />
  <title>EXHIBIT FLOW | 전시 프로젝트 운영</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="EXHIBIT FLOW 홈">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>EXHIBIT FLOW</strong><small>AI Project Operations Partner</small></span>
      </a>
      <div class="side-caption">WORKSPACE</div>
      <nav class="main-nav" aria-label="주 메뉴">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span> 대시보드</button>
        <button class="nav-item" data-view="projects"><span class="nav-icon">▤</span> 프로젝트 준비</button>
        <button class="nav-item" data-view="compare"><span class="nav-icon">⇄</span> 업체·견적 비교</button>
        <button class="nav-item" data-view="messages"><span class="nav-icon">▧</span> 소통 관리</button>
        <button class="nav-item" data-view="checklist"><span class="nav-icon">☑</span> 현장 체크리스트</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-tip"><span>✦</span><strong>준비의 빈틈을 줄이는 방법</strong><p>흩어진 정보를 모으고 다음 할 일을 한곳에서 확인하세요.</p></div>
        <div class="local-badge"><span class="pulse-dot"></span> 이 브라우저에 자동 저장</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기">☰</button><span class="breadcrumb">WORKSPACE <b>/</b> <span id="breadcrumbName">대시보드</span></span></div>
        <div class="topbar-right"><span class="today" id="todayLabel"></span><button class="project-switch" id="projectSwitch" title="프로젝트 선택"><span class="switch-avatar">E</span><span id="activeProjectShort">서울 아트페어 전시 준비</span><span class="chevron">⌄</span></button></div>
      </header>

      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><div class="eyebrow">EXHIBIT FLOW</div><h2 id="modalTitle"></h2></div><button class="icon-button" id="closeModal" aria-label="닫기">×</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
